name: Update Movement yoga calendar

on:
  # Manual-only while scraper is being diagnosed.
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: movement-yoga-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser scraper
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build calendar from Movement's public schedules
        run: python scripts/build_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          if git diff --cached --quiet; then
            echo "Calendar is already up to date."
          else
            git commit -m "Update Movement yoga calendar"
            git push
          fi
